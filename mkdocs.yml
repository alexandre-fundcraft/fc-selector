site_name: FC Selector
site_description: DDD Selector/Query pattern for Django with OData query language support

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - toc.integrate

plugins:
  - search
  - auto-refresh-build-pages:
      update_message: "The page has been updated. Do you want to reload?"
      yes_button_text: "Yes"
      no_button_text: "No"
      check_interval_seconds: 60

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Why FC Selector?:
    - Benefits: theory/benefits.md
    - Problems It Solves: theory/selector-pattern.md
  - Theory:
    - What is OData?: theory/odata.md
    - What are DTOs?: theory/dtos.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: quickstart.md
  - Core Concepts: concepts.md
  - Usage Guide:
    - Selectors: selectors.md
    - Query Builder: query-builder.md
    - DTOs: dtos.md
    - ViewSets: viewsets.md
  - Reference:
    - Architecture: architecture.md
    - OData Syntax: odata-syntax.md
    - API Reference: api-reference.md
    - Hybrid Values Mode: HYBRID_VALUES_EXPAND.md
  - Contributing:
    - Developer Guide: internals_guide.md
