[project]
name = "fc-selector"
version = "1.0.1"
description = "DDD Selector/Query pattern for Django with OData query language support"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Alexandre Busquets", email = "alexandre.busquets@fundcraft.lu"}
]
keywords = ["django", "odata", "rest", "api", "djangorestframework", "selector", "ddd", "query", "repository"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core (AST, QueryIntent, fluent filters, DTOs and the OData parser) needs no framework.
dependencies = ["sly>=0.5"]

[project.optional-dependencies]
# Everything under fc_selector.django
django = [
    "django>=4.2.20",  # Minimum version with security fixes (CVE-2026-1287, CVE-2026-1312)
    "djangorestframework>=3.12.0",
    "drf-spectacular>=0.29.0",
]

[dependency-groups]
dev = [
    "fc-selector[django]",
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "pytest-django>=4.0",
    "pytest-benchmark>=3.4.0",
    "mypy>=0.900",
    "ruff>=0.5.5",
    "Faker>=25.0.0",
    "mkdocs-material>=9.0",
    "mkdocs-auto-refresh-build-pages>=1.0.3",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocs-auto-refresh-build-pages>=1.0.3",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Rules documentation: https://docs.astral.sh/ruff/rules/
select = [
    "E",   # pycodestyle errors (includes E402 - module level import not at top)
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "YTT", # flake8-2020
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear,
    "N",   # pep8-naming
    "I",   # isort
    "PL",  # pylint
]

# Enable automatic fixes including adding noqa comments where appropriate
fixable = ["ALL"]  # Allow all automatic fixes
unfixable = []  # Don't prevent any fixes

ignore = [
    "B007",    # Loop control variable not used within loop body
    "B008",    # do not perform function calls in argument defaults
    "B017",    # do not assert blind exceptions
    "B025",    # try-except block with duplicate exception
    "B024",    # abstract base class, but it has no abstract methods
    "B026",    # Star-arg unpacking after a keyword argument is strongly discouraged
    "B027",    # is an empty method in an abstract base class
    "B904",    # `except` clause, raise exceptions with `raise
    "B905",    # `zip()` without an explicit `strict=` parameter
    "C901",    # too complex
    "D100", "D101", "D103",  # Missing docstrings
    "E501",    # Line too long (handled by formatter)
    "F811",    # Redefinition of unused name
    "N802",    # Function name should be lowercase (visitor pattern uses visit_NodeName)
    "N806",    # Variable in function should be lowercase
    "N818",    # Exception name should end with 'Error'
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments to function call
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "PLW2901", # `for` loop variable overwritten by assignment target
]

[tool.ruff.lint.per-file-ignores]
# sly library uses dynamic `_` decorator and function redefinition for grammar rules
"fc_selector/protocols/odata/parsers/filter/grammar.py" = ["F821", "F811"]
# Allow inline imports in django module (some are needed to avoid circular imports)
"fc_selector/django/**/*.py" = ["PLC0415"]
# Allow inline imports in protocols module
"fc_selector/protocols/**/*.py" = ["PLC0415"]
# Allow inline imports in example app
"example/**/*.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fc_selector*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "example/",
]

[[tool.mypy.overrides]]
module = [
    "django.*",
    "rest_framework.*",
    "sly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
python_files = "tests.py test_*.py *_tests.py"
addopts = "--verbose --tb=short --no-migrations"
testpaths = ["tests", "example"]
markers = [
    "benchmark: run benchmark tests",
]

[tool.coverage.run]
source = ["fc_selector"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
